# The installer's own settings, on top of the ones bootc-image-builder writes
# (its 90-osbuild.conf, the module list from disk_config/iso.toml). Put in by
# ci/brand-installer-iso.sh as /etc/anaconda/conf.d/95-cabinetos.conf in the
# ISO's product image; conf.d is read after Fedora's profile, so these win.

[User Interface]
# CabinetOS's look in place of Fedora's (disk_config/installer.css).
custom_stylesheet = /usr/share/anaconda/pixmaps/cabinetos.css

# Network & Host Name: its module is off (iso.toml) and the install needs no
# network (#136), but the screen was still drawn, saying there were no
# network devices. Hiding it is this setting (#284).
hidden_spokes = NetworkSpoke
