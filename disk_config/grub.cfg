# The installer stick's boot menu, for UEFI and BIOS alike. Put on the ISO by
# ci/brand-installer-iso.sh in place of bootc-image-builder's menu, which
# offered "Install CabinetOS 44", "Test this media & install" and a
# Troubleshooting submenu, waiting 60 seconds.
#
# One entry, started after a few seconds: the drive question that follows asks
# before anything is written, so starting by itself is safe. The media check
# is gone: it passes on a good copy, and on a badly written stick it failed
# without saying what to do (#106).
#
# Under UEFI the menu is a picture, the console's start screen with the entry
# on it (grub-theme.txt). GRUB's graphical screen keeps the mode the firmware
# is already in (efi_gop.c, "Keep current mode if possible", when gfxmode is
# left at auto), and gfxpayload=keep hands that mode on, so the installer
# runs at the same resolution as with the plain menu. Without the font, or
# under BIOS, it stays the plain menu. (The font check is two nested ifs:
# GRUB's script has no `&&`.)
#
# THE KERNEL LINE IS THE BUILDER'S OWN, which the branding script checks is
# still there, with what keeps the start quiet added after `quiet`.
# loglevel=0 keeps the kernel's messages off the screen; the installer
# runtime carries no GPU or Wi-Fi firmware, and its errors about that look
# like a broken machine (#136). Under `quiet` alone systemd prints every step
# once one is slow (finding the stick is): systemd.show_status=error keeps it
# to failures. dracut's warnings reach the screen through journald, which
# max_level_console=crit stops; a stick that cannot be read still ends in
# dracut's emergency shell, which says so. Plymouth has no picture in the
# installer, only text that repeats all of the above, so it is off.
# fbcon=nodefer clears the screen as the kernel starts: GRUB leaves a black
# box over the picture when it starts the entry (its theme engine always
# opens one, at least 80 by 24 characters), and the kernel would otherwise
# keep that on screen until the installer prints.

if [ "$grub_platform" = "efi" ]; then
  insmod efi_gop
  insmod efi_uga
fi
insmod all_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

set timeout=5
search --no-floppy --set=root -l 'CabinetOS'

if [ "$grub_platform" = "efi" ]; then
  if loadfont /EFI/BOOT/fonts/unicode.pf2; then
    insmod gfxterm
    insmod gfxmenu
    insmod png
    terminal_output gfxterm
    set theme=/boot/grub2/themes/cabinetos/theme.txt
  fi
fi

menuentry 'Install CabinetOS' --class os {
	linux /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=CabinetOS inst.ks=hd:LABEL=CabinetOS:/osbuild.ks quiet loglevel=0 systemd.show_status=error systemd.journald.max_level_console=crit rd.plymouth=0 plymouth.enable=0 fbcon=nodefer
	initrd /images/pxeboot/initrd.img
}
