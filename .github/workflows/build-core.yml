---
# Build the libretro cores for Linux x86-64, on a machine nobody owns.
#
# Until this existed, every core had been built on exactly one box — the test
# VM — which is the precise failure docs/PROJECT.md open question 13 was raised
# to prevent. "It builds here" is not a property of the build, it is a property
# of that machine, and the difference only shows up on the day the machine is
# gone.
#
# What this asserts, beyond "make exited 0":
#
#   * the source is at the pinned commit, not at HEAD (build-core.sh);
#   * the finished .so reports that same revision as its own version string
#     (tools/core-info.c), so a core that was built without git — and therefore
#     does not know what it is — fails the build instead of shipping;
#   * the .so loads with RTLD_LOCAL and speaks the libretro API version the
#     frontend was compiled against.
#
# What it does NOT assert, and cannot here: that a save state from this build
# loads in Cabinet's. That needs a ROM, and no ROM belongs in this repository.
# tools/state-probe.c is the instrument for it and it runs on the test machine.

name: Build cores

# CALLED BY build.yml as of 2026-09-19, because the image now carries the
# cores and has to get them from somewhere. Calling this rather than copying
# its steps is the point: there is one place a core is built, and it is the
# place that asserts the pinned revision.
#
# WHICH IS WHY THIS NO LONGER RUNS ITSELF ON MAIN. build.yml calls this
# workflow on every push to main and testing (not on its pull requests), and
# its path filter skips documentation only and can therefore never skip a
# change under `cores/`, so a `push` trigger here as well meant the same core
# builds queued TWICE for one change. That is
# not merely wasteful: a runner has a concurrency cap, so the duplicate starves
# the image build of the runners it is waiting for, and it doubled the wall
# clock of the change that introduced it. Cancelling one by hand then leaves a
# red cross on a pull request whose code is fine, which is how a check stops
# meaning anything.
#
# ON EVERY PULL REQUEST AIMED AT ANYTHING **BUT** MAIN — which is the same
# guard as before, aimed at the gap it was actually written for. It asked for
# `branches: [main]` until 2026-09-16, and that day four branches were stacked
# on each other, so the one pull request that existed targeted another branch,
# this workflow was not eligible, and the check built specifically to stop "it
# builds on one machine" silently did not apply. `branches-ignore` covers
# exactly that case and nothing build.yml already covers. **Do not narrow it
# to `branches: [main]` again** — that is the hole, and build.yml is what fills
# the other half.
#
# The paths filter is what keeps this rare: it runs when a core actually
# changes, which is the only time the pinned-revision assertion has anything
# to say.
on:
  workflow_call:
  pull_request:
    branches-ignore:
      - main
    paths:
      - 'cores/**'
      - 'tools/core-info.c'
      - 'frontend/src/libretro.h'
      - 'frontend/Containerfile'
      - 'ci/core-cache-key.sh'
      - '.github/workflows/build-core.yml'
  workflow_dispatch:

# NO `concurrency:` HERE, DELIBERATELY, AND IT IS NOT AN OVERSIGHT.
#
# A concurrency group is a string, and build.yml now calls this workflow. If
# the string a called run computes ever matches the one its caller computed —
# and `github.workflow` inside a called workflow is documented as the CALLER's
# name — then `cancel-in-progress` has a run cancelling itself, which surfaces
# as a red image build with no failing step in it. Getting that string
# provably distinct in all four combinations of called/standalone and
# push/pull_request is more cleverness than the thing is worth.
#
# What is given up is cancelling a superseded run. build.yml's own group still
# cancels the whole thing, called jobs included, so that only costs anything
# when somebody pushes twice in ten minutes to a branch that touches cores/ —
# which is rare, because the paths filter above is what keeps this workflow
# rare.

jobs:
  # ONE CONTAINER BUILD PER RUN, NOT TWENTY.
  #
  # Every core in the matrix below used to build this container itself, which
  # meant twenty runners each downloading the same 267 MB of Fedora packages
  # independently. That is not only twenty times the work — it is twenty
  # independent chances for a mirror to time out, and on 2026-09-16 one did:
  # `Build prosystem` failed after two minutes at under 1 KB/s on openh264,
  # with nothing whatsoever wrong with prosystem. It passed on re-run in fifty
  # seconds. A test that fails for reasons unrelated to the code is a test
  # people learn to ignore.
  #
  # The image is tagged by the SHA of the Containerfile that produced it, so an
  # unchanged Containerfile reuses the published image across runs and never
  # builds at all, and a changed one gets a new tag that cannot collide with
  # the old.
  builder:
    name: Builder container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Name the image after the Containerfile that makes it
        id: ref
        run: |
          set -euo pipefail
          # Lowercased, because a registry requires it and the owner here is not.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag=$(sha256sum frontend/Containerfile | cut -c1-16)
          echo "image=ghcr.io/$owner/cabinetos-builder:$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish it, unless that exact one is already published
        run: |
          set -euo pipefail
          image="${{ steps.ref.outputs.image }}"
          if podman manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published; nothing to build"
            exit 0
          fi
          # Fedora 44 because Bazzite 44 is. The same container the frontend is
          # built in and the same one the test VM uses, so CI and the
          # development loop are not two different builds wearing one name.
          podman build -t "$image" -f frontend/Containerfile frontend
          podman push "$image"

  build:
    name: Build ${{ matrix.core }}
    runs-on: ubuntu-24.04
    needs: builder
    permissions:
      contents: read
      packages: read

    strategy:
      # One core's failure should not hide another's. All four of the
      # backend-sensitive cores — pcsx_rearmed, melonDS, Flycast, picodrive —
      # are in this matrix now, and knowing which of them broke is most of the
      # diagnosis.
      fail-fast: false
      matrix:
        core:
          - gambatte
          - genesis_plus_gx
          - fceumm
          - snes9x
          - beetle_pce_fast
          - beetle_ngp
          - beetle_vb
          - beetle_saturn
          - stella2014
          - prosystem
          - opera
          - vecx
          - mame2003_plus
          - fbneo_libretro
          - pcsx_rearmed
          - melonds
          - picodrive
          - mgba
          - mupen64plus
          - flycast
          - ppsspp
          # GameCube, added 2026-09-21. Wii comes free from the same core when
          # somebody has Wii games to try it with.
          - dolphin
          # Nintendo 3DS, Azahar's own core (docs/PROJECT.md question 50).
          - azahar

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulled, not built — see the builder job above for why. The fallback is
      # not decoration: a pull request from a fork gets a read-only token, so
      # the builder job cannot publish, and without this every core build
      # would fail in a way that reads as every core broken.
      - name: Fetch the builder container
        id: builder
        run: |
          set -euo pipefail
          image="${{ needs.builder.outputs.image }}"
          if podman pull "$image"; then
            echo "builder=$image" >> "$GITHUB_OUTPUT"
          else
            echo "could not pull $image; building it here instead"
            podman build -t cabinetos-builder -f frontend/Containerfile frontend
            echo "builder=cabinetos-builder" >> "$GITHUB_OUTPUT"
          fi

      # A CORE CANNOT CHANGE UNLESS ITS OWN RECIPE, THE SHARED PART OF THE
      # SCRIPT OR THE TOOLCHAIN DOES, so a cache keyed on those is not a guess
      # about staleness: it is the whole input. cores/build-core.sh holds every
      # core's pinned commit, patches and build arguments, each in that core's
      # case arm and patch block, and the steps every core runs;
      # frontend/Containerfile is the toolchain. Upstream cannot shift
      # underneath any of it, because the checkout is by commit SHA and not
      # by a tag.
      #
      # ONE CORE'S PART, NOT THE WHOLE FILE. The key was hashFiles over those
      # two files until 2026-10-20, when adding the 3DS's recipe (#524)
      # changed every core's key and rebuilt all twenty-three: eighteen
      # minutes of that day's testing build before the image could start
      # (Dolphin alone is sixteen and a half). hashFiles cannot hash part of a
      # file, so ci/core-cache-key.sh prints the key instead: the script with
      # every other core's arm and patch blocks taken out, and the
      # Containerfile. A change inside one core's arm or patches rebuilds that
      # core alone; a change to any other line of the script, or to the
      # Containerfile, rebuilds them all. Splitting the recipes into a file
      # per core would let hashFiles do it, at the price of a new folder and
      # every recipe moved; reading the arms where they are costs one script.
      #
      # Why it is worth the machinery: PPSSPP alone is eight and a half
      # minutes, FBNeo nearly seven, and build.yml builds every core before
      # every image. That was about half the wall clock of a change
      # that touched a shell script and could not possibly have altered a
      # core.
      #
      # THE PINNED-REVISION ASSERTION STILL RUNS ON A HIT — see the step below
      # and the --verify-only block in build-core.sh. Skipping the proof to
      # save ten seconds would trade away the only thing this workflow buys.
      - name: Name the cache after what can change this core
        id: corekey
        run: |
          set -euo pipefail
          key=$(ci/core-cache-key.sh "${{ matrix.core }}")
          echo "${{ matrix.core }}: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the built core, if this exact one has been built before
        id: corecache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            cores/build
            cores/system
          key: core-${{ matrix.core }}-${{ steps.corekey.outputs.key }}

      - name: Build the core
        if: steps.corecache.outputs.cache-hit != 'true'
        env:
          # build-core.sh already reads this, so the image it uses is chosen
          # here rather than by a retag.
          CABINETOS_BUILDER: ${{ steps.builder.outputs.builder }}
        run: |
          set -euo pipefail
          cores/build-core.sh "${{ matrix.core }}" | tee /tmp/build.log

      # Nothing was compiled, so prove the thing that came out of the cache is
      # still the pinned revision. Reads it back out of the .so itself.
      - name: Check the cached core is the pinned revision
        if: steps.corecache.outputs.cache-hit == 'true'
        env:
          CABINETOS_BUILDER: ${{ steps.builder.outputs.builder }}
          CABINETOS_VERIFY_ONLY: "1"
        run: |
          set -euo pipefail
          cores/build-core.sh "${{ matrix.core }}" | tee /tmp/build.log

      # ONE FIXED SHAPE, WHATEVER THE CORE PRODUCED.
      #
      # This used to upload `cores/build/*.so` and `cores/system/` as two
      # globs, and an artifact's internal root is the least common ancestor of
      # the files actually found — so the cores with no system files got
      # an artifact rooted at `cores/build` and PPSSPP got one rooted at
      # `cores`. Two different layouts under one naming scheme, which nothing
      # noticed while nothing downloaded them. The image build downloads every
      # one and merges them, so it does now.
      #
      # This is also the layout ci/stage-image-payload.sh takes.
      - name: Stage it
        run: |
          set -euo pipefail
          mkdir -p artifact/cores artifact/system
          cp cores/build/*.so artifact/cores/
          # Empty for all but PPSSPP and Dolphin. PPSSPP's system files are not a
          # console's firmware and do not come from RomM — they ship with the
          # emulator — so they are part of what this job produces, and a core
          # artifact without them is a core that boots a game with no fonts.
          if [ -n "$(ls -A cores/system 2>/dev/null)" ]; then
            cp -R cores/system/. artifact/system/
          fi
          # An arcade emulator's catalogue, from its own list at the pinned
          # commit (frontend/src/arcadematch.h). Every other core writes
          # nothing. Run on a cache hit too, since it is not in the cache.
          cores/arcade-sets.sh "${{ matrix.core }}" artifact/cores
          find artifact -type f | sort

      - name: Upload the core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.core }}-linux-x86_64
          path: artifact/
          if-no-files-found: error
          # Long enough to bisect a parity problem against, short enough that
          # these do not accumulate. Phase 5 decides how cores actually ship;
          # this is not that.
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.core }} — Linux x86-64"
            echo
            if [[ -f /tmp/build.log ]]; then
              echo '```'
              cat /tmp/build.log
              echo '```'
            else
              echo "The build produced no log, so it failed before starting."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
