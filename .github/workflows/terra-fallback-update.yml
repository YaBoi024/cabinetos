# Keep the stored copy of Steam's session current: open a pull request when it
# changes (#270).
#
# The image build installs gamescope-session and gamescope-session-steam from
# terra, and falls back to build_files/terra-fallback/ when terra will not
# answer properly (build_files/install-steam-session.sh). A spare that never
# moves would one day install a session older than the one Bazzite runs, so
# this checks monthly, on the 1st with the base
# (docs/decisions/2026-11-10-scheduled-checks-monthly.md). It never merges
# anything.

name: Check Steam session copy

on:
  schedule:
    # The 1st at 10:00 UTC, after the base check.
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: terra-fallback-update
  cancel-in-progress: false

jobs:
  check:
    name: Check terra for a newer Steam session
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Fetch and verify
        id: fetch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm zstd >/dev/null
          tools/terra-fallback-update.py | tee /tmp/out.txt
          LAST=$(tail -1 /tmp/out.txt)
          echo "${LAST}" >> "${GITHUB_OUTPUT}"
          if [ "${LAST}" = "changed=true" ]; then
            NOW=$(grep '^now: ' /tmp/out.txt | sed 's/^now: //')
            echo "now=${NOW}" >> "${GITHUB_OUTPUT}"
            echo "short=$(echo "${NOW}" | md5sum | cut -c1-10)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open a pull request
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BASE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          NOW: ${{ steps.fetch.outputs.now }}
          SHORT: ${{ steps.fetch.outputs.short }}
        run: |
          set -euo pipefail
          BRANCH="terra-fallback/${SHORT}"
          # No player notices the spare (used only when terra fails during a
          # build), so changelog.yml is told so.
          cat > /tmp/pr-body.md <<EOF
          **What it does:** updates the stored copy of Steam's session (the image's fallback when terra will not answer) to what terra serves now: ${NOW}. Both packages verified against terra's key.

          **Why:** the spare should match what Bazzite runs (#270). It is used only when terra fails during an image build.

          Changelog: none
          EOF
          # Already pushed: as base-update.yml, left alone with a pull
          # request, opened now without one.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            prs=$(gh pr list --head "${BRANCH}" --state all --json number \
              --jq 'map("#\(.number)") | join(" ")')
            if [[ -n "${prs}" ]]; then
              echo "Branch ${BRANCH} already has a pull request (${prs}); leaving it alone."
              exit 0
            fi
            echo "Branch ${BRANCH} is pushed but has no pull request; opening it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "${BRANCH}"
            git add -A build_files/terra-fallback
            git commit -m "Steam session spare copy: ${NOW}"
            git push origin "${BRANCH}"
          fi
          # A failure says so in the run's summary, as base-update.yml's does.
          if ! gh pr create --title "Steam session spare copy update" --body-file /tmp/pr-body.md \
              --base "${{ github.event.repository.default_branch }}" --head "${BRANCH}"; then
            {
              echo "### Could not open the pull request"
              echo
              echo "The branch \`${BRANCH}\` is pushed and the update is in it."
              echo "If the error mentions \`createPullRequest\`, turn on"
              echo "**Settings → Actions → General → Allow GitHub Actions to"
              echo "create and approve pull requests**, then re-run this job."
              echo
              echo "Open it by hand meanwhile:"
              echo '```'
              echo "gh pr create --base main --head ${BRANCH}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
