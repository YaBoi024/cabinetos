---
# Compile the frontend on a machine nobody owns.
#
# Every core has built on a clean runner since 2026-09-13, for a reason
# docs/PROJECT.md states plainly: "it builds here" is not a property of the
# build, it is a property of that machine, and the difference only shows up on
# the day the machine is gone.
#
# The frontend itself was not held to that standard and should have been. Until
# this existed, `cabinetos-frontend` had only ever been compiled on the test VM —
# the same single-machine dependency, in the one program that has to load
# every core.
#
# What this asserts is modest and worth having: the tree compiles from a bare
# checkout, in the same Fedora 44 container the cores and the VM use, with the
# warnings the Makefile asks for. It runs only what needs no screen: the option
# tables and the self-tests (ci/run-self-tests.sh). The rest needs a Wayland
# display and a GPU, and the test machine remains where that happens.
#
# ON EVERY PULL REQUEST AIMED AT ANYTHING **BUT** MAIN. This asked for
# `branches: [main]` until 2026-09-16, and that day four branches were stacked
# on each other — so the one pull request that existed targeted another branch,
# this workflow was not eligible, and the compile check that had been built
# specifically to stop "it builds on one machine" silently did not apply to the
# work being written. A guard with a condition on it is a guard that is absent
# exactly when somebody is doing something unusual.
#
# It then ran on EVERY pull request until 2026-09-19, when build.yml started
# calling it — which made a pull request aimed at main compile the frontend
# twice for one change. `branches-ignore` leaves exactly the gap build.yml
# does not reach and removes the overlap. **Do not narrow it back to
# `branches: [main]`**; that is the original hole. See build-core.yml, where
# the same change removed a duplicated job per core rather than one.

name: Build frontend

# ALSO CALLED BY build.yml, which is new as of 2026-09-19 and is the reason
# this uploads its binary rather than throwing it away. The image now carries
# the frontend, so the image build needs the thing this job produces — and
# calling this workflow rather than copying its steps means the binary in the
# image is built exactly one way, by the file whose job that is.
on:
  workflow_call:
  pull_request:
    branches-ignore:
      - main
    paths:
      - 'frontend/**'
      - 'wiibridge/**'
      - 'cores/options/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

# No `concurrency:` — see the block in build-core.yml, which explains why, and
# applies here for the same reason: build.yml calls this workflow too.

# REPORT ONLY FOR A CHECK'S FIRST WEEK, the rule and the date checks.yml has:
# until the end of this day (UTC) a check here that can fail warns and
# passes; from the next day it fails. A new check that can fail starts the
# same way: set this a week ahead in its pull request.
env:
  REPORT_ONLY_UNTIL: '2026-10-25'

jobs:
  build:
    name: Compile
    runs-on: ubuntu-24.04

    steps:
      # Two deep, so a pull request's base (the merge commit's first parent)
      # is here for "New warnings" at the end.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2

      # The same container the cores are built in and the same one the test VM
      # uses, so CI and the development loop are not two different builds
      # wearing one name. PULLED, NOT BUILT, when build-core.yml has published
      # it: it is named after the Containerfile's hash, so a pulled one is the
      # same container, and a build no longer installs Fedora's packages from
      # outside each time (MMagTech, 2026-10-12). Public, so no sign-in. Built
      # here when the pull fails: a Containerfile change whose builder is not
      # published yet, or the registry away.
      - name: Fetch the builder container
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/cabinetos-builder:$(sha256sum frontend/Containerfile | cut -c1-16)"
          if podman pull "$image"; then
            podman tag "$image" cabinetos-builder
            echo "pulled $image"
          else
            echo "could not pull $image; building it here instead"
            podman build -t cabinetos-builder -f frontend/Containerfile frontend
          fi

      - name: Compile
        run: |
          set -euo pipefail
          podman run --rm -v "$PWD/frontend":/src:Z -w /src cabinetos-builder \
            make -j"$(nproc)" -O 2>&1 | tee /tmp/build.log

      # THE WII BRIDGE (#200, wiibridge/): its own program, GPL, in the same
      # container. Built here so the image carries it beside the frontend that
      # starts it, and so it moves in the frontend's small layer.
      - name: Compile the Wii bridge
        run: |
          set -euo pipefail
          podman run --rm -v "$PWD/wiibridge":/src:Z -w /src cabinetos-builder \
            make 2>&1 | tee -a /tmp/build.log

      # THE WII BRIDGE'S PACING TEST (#480, wiibridge/pacing-test.cpp): two
      # Remotes on socket pairs through the bridge's own loop, no hardware,
      # about two seconds. Report only until REPORT_ONLY_UNTIL, then a
      # failure, as every new check here starts.
      - name: Test the Wii bridge
        run: |
          set -euo pipefail
          if ! podman run --rm -v "$PWD/wiibridge":/src:Z -w /src cabinetos-builder make test; then
            if [[ ! "$(date -u +%F)" > "${REPORT_ONLY_UNTIL}" ]]; then
              echo "::warning::The Wii bridge's pacing test failed. Report only until ${REPORT_ONLY_UNTIL} (UTC): passing. From the next day this fails."
              exit 0
            fi
            exit 1
          fi

      # EVERY OPTION VALUE THE CONSOLE SETS, AGAINST WHAT EACH CORE DECLARES
      # (#63, the version-bump check, frontend/src/optcheck.h). A table that
      # names a key a core does not have, or a value it does not accept,
      # fails here rather than going nowhere on a television, and so does a
      # libretro core with no list. The cores' lists are cores/options/,
      # which build-core.sh keeps honest.
      - name: Check the option tables
        run: |
          set -euo pipefail
          podman run --rm -v "$PWD":/repo:Z -w /repo cabinetos-builder \
            frontend/build/cabinetos-frontend --check-option-tables cores/options

      # THE SELF-TESTS THAT NEED NO SCREEN, SERVER OR CONSOLE (#398): the
      # table in CONTRIBUTING.md, "Running and testing", each in a scratch
      # storage root, HOME and drive search. ci/run-self-tests.sh lists them
      # and the ones that cannot run here. Report only until
      # REPORT_ONLY_UNTIL, then a failure.
      - name: Self-tests
        run: ci/run-self-tests.sh

      # EVERY ARCADE GAME WHOSE EMULATOR WOULD CHANGE, on a pull request that
      # changes what the arcade catalogues are made from: a game that moves
      # loses its saves and states
      # (docs/decisions/2026-10-28-emulator-updates-and-saves.md). A report
      # in the summary, and nothing at all when no catalogue's sources
      # changed. ci/list-arcade-changes.sh.
      - name: Arcade games whose emulator would change
        if: github.event_name == 'pull_request'
        run: ci/list-arcade-changes.sh "${{ github.event.pull_request.base.sha }}"

      # The image build downloads this. Uploaded on every run and not only
      # when called, because a binary you can fetch off a finished run is how
      # somebody puts a build on a machine without having to reproduce it.
      #
      # The `bin/` is the payload layout ci/stage-image-payload.sh expects, so
      # a merged download of this artifact and the core artifacts
      # already has the shape it wants.
      - name: Stage it
        run: |
          set -euo pipefail
          mkdir -p artifact/bin
          cp frontend/build/cabinetos-frontend artifact/bin/
          cp wiibridge/cabinetos-wii-bridge artifact/bin/
          file artifact/bin/cabinetos-frontend artifact/bin/cabinetos-wii-bridge

      - name: Upload the frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-linux-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Warnings
        if: always()
        run: |
          # Not a failure, because -Werror on a tree that already carries
          # warnings would turn this into a chore rather than a signal. Surfaced
          # instead, so a new one is visible in the summary rather than buried
          # in a log nobody opens.
          {
            echo "## Frontend"
            echo
            if grep -q 'warning:' /tmp/build.log; then
              echo '```'
              grep 'warning:' /tmp/build.log | sort -u
              echo '```'
            else
              echo "No warnings."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # NO NEW WARNINGS IN THE FILES A PULL REQUEST TOUCHES (CLAUDE.md rule 6,
      # #398): the touched files' warnings against the same files compiled
      # at the base, by ci/check-new-warnings.sh, which says how and what it
      # costs. Pull requests only, because a push has no base to compare
      # with. Report only until REPORT_ONLY_UNTIL, then a failure.
      - name: New warnings
        if: github.event_name == 'pull_request'
        run: ci/check-new-warnings.sh /tmp/build.log

      # THE CODE NOTHING CALLS, AS THE LINKER SEES IT (#398): a scratch build
      # at -O0 with a section per function, linked with --gc-sections
      # --print-gc-sections, by ci/report-unused-code.sh. A report in the
      # summary, never a failure, and never the binary that ships, which is
      # uploaded above. Pull requests only, so an image build never waits for
      # it; not skipped when "New warnings" fails.
      - name: Unused code
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: ci/report-unused-code.sh
