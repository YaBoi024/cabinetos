---
# Build, sign and publish the CabinetOS container image to GHCR.
#
# Derived from the Universal Blue image-template (Apache-2.0):
#   https://github.com/ublue-os/image-template
#
# Pull requests run the lint and the frontend compile; the image is built and
# published only from main and testing, so a PR from anyone can never
# publish a package under your account.

name: Build CabinetOS image

# PULL REQUESTS AIMED AT MAIN run the cheap checks here (lint, the frontend
# compile); build-frontend.yml and build-core.yml also trigger themselves on
# pull requests to other branches, widened on 2026-09-16 after a stack of
# branches slipped past them. The image itself is built by a push to
# testing or main (the jobs below say so), because the question it answers
# is "does the image that ships build".
on:
  pull_request:
    branches:
      - main
    # The same path filter the push trigger has always had. Without it here,
    # a documentation-only pull request cost twelve minutes of runner time to
    # rebuild an image whose inputs had not changed — which is how a check
    # becomes something people route around rather than wait for.
    #
    # `frontend/**` WAS ON THIS LIST FOR ONE DAY AND IS GONE AGAIN, 2026-09-19.
    # It was added when the Containerfile copied build_files, system_files and
    # two licence files and nothing whatsoever from frontend/, so a session
    # spent on frontend source was starting a thirteen-minute image build per
    # push for an image whose inputs had not moved. The comment that went with
    # it said, in capitals, to take it back out the day the image carried the
    # frontend. The image carries the frontend as of today, so it is out: the
    # binary in the image is built from frontend/, and leaving the line in
    # would mean a change to the console's own source no longer builds the
    # thing that ships it.
    #
    # `paths`, NOT `paths-ignore`, SINCE #156: docs/LICENCES.md is the one
    # document in the image (the Containerfile copies it to /licences/), and
    # under the old ignore list a change to it alone built nothing, so
    # consoles kept the old list. Only `paths` can take a file back after
    # ignoring its folder; the last pattern that matches wins.
    # `.github/**` is named because GitHub's documentation does not say `**`
    # reaches a folder whose name starts with a dot, and a workflow change
    # built before. ci/promote-tested.sh ignores the same files, and the push
    # trigger below has the same list; keep all three the same.
    paths:
      - '**'
      - '.github/**'
      - '!**.md'
      - '!docs/**'
      - 'docs/LICENCES.md'
  push:
    branches:
      - main
      # THE TESTING CHANNEL. A push here publishes `cabinetos:testing`, never
      # `latest`, for MMagTech's test console, which follows it (switched
      # with `bootc switch`). An update can only be shown with an image newer
      # than the installed one, and the root half of System update cannot run
      # in tools/ui-loop.sh, so this is how both get tried on a television
      # before anything reaches main. docs/SETTINGS.md, System.
      - testing
    # The same list as the pull request trigger above; read the comment there.
    paths:
      - '**'
      - '.github/**'
      - '!**.md'
      - '!docs/**'
      - 'docs/LICENCES.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

# A literal prefix rather than ${{ github.workflow }}, so that this group
# cannot collide with one computed inside the workflows called below. See the
# block at the top of build-core.yml.
concurrency:
  group: cabinetos-image-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # THE TESTED IMAGE SHIPS; IT IS NOT BUILT AGAIN. MMagTech, 2026-09-25:
  # "The intent of test was I could build and test features and then when
  # all was good we go to main." So on a push to main this looks first: if
  # main's files are exactly what the current `testing` image was built
  # from, that image is tagged `latest` (seconds, no build) and every job
  # below is skipped. Otherwise it builds as it always has. The rule that
  # makes it work: push the final commit to `testing`, judge it, then merge.
  # ci/promote-tested.sh.
  promote:
    name: Promote the tested image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Every branch's history, so the commit `testing` was built from
          # can be found and its files compared.
          fetch-depth: 0

      - name: Promote testing to latest, if it is exactly this
        id: promote
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/promote-tested.sh "${IMAGE_REGISTRY,,}/cabinetos"

  # Cheap checks first. A shell typo in a strip script should fail in ten
  # seconds, not after a twenty minute image build.
  lint:
    name: Lint build scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Shellcheck
        run: |
          # SC1091: shellcheck cannot follow `source /ctx/lib.sh`, since /ctx
          # only exists inside the container build.
          find build_files ci cores -name '*.sh' -print0 \
            | xargs -0 shellcheck -e SC1091
          # THE SCRIPTS THAT SHIP IN THE IMAGE, which this lint did not cover
          # until 2026-09-19 — they live outside those three directories and
          # carry no .sh extension, so `find -name '*.sh'` never saw them.
          #
          # They are the ones that most need it. `cabinetos-session` is what
          # the machine boots into: a mistake in it is not a failed build, it
          # is a console that comes up to a black screen or silently on
          # software rendering, and it is only ever exercised on real hardware.
          # It was carrying an `ls | grep` (SC2010) on the directory that
          # holds a compositor's sockets, which is a shape shellcheck warns
          # about and a glob plus a socket test says better.
          #
          # Selected by their shebang rather than their path, so a script added
          # to the image later is covered without anyone remembering to add it.
          find system_files -type f -exec \
            sh -c 'head -1 "$1" | grep -q "^#!.*sh" && echo "$1"' _ {} \; \
            | xargs -r shellcheck -e SC1091

      # The Python that ships (the diagnostic report and its privacy scrubber,
      # cabinetos-steam-libraries) and the Python in the tree: parsed, so a
      # syntax slip fails here and not on a console making a report (#487,
      # SCRIPTS-21). Shipped files are picked by their shebang, as above.
      - name: Python syntax
        run: |
          {
            find build_files ci cores tools -name '*.py'
            find system_files -type f -exec \
              sh -c 'head -1 "$1" | grep -q "^#!.*python" && echo "$1"' _ {} \;
          } | xargs python3 -c 'import ast, sys
          for p in sys.argv[1:]:
              ast.parse(open(p, encoding="utf-8").read(), p)
          print(len(sys.argv) - 1, "files parse")'

      # The installer's own scripts, %pre and %post in disk_config/iso.toml,
      # run only when somebody installs. Cut out and checked like the rest.
      # SC2094: %pre reads and writes the same terminal on purpose.
      - name: Shellcheck the installer's scripts
        run: |
          mkdir -p "${RUNNER_TEMP}/ks"
          python3 - "${RUNNER_TEMP}/ks" <<'PY'
          import pathlib, re, sys, tomllib
          ks = tomllib.load(open("disk_config/iso.toml", "rb"))
          text = ks["customizations"]["installer"]["kickstart"]["contents"]
          out = pathlib.Path(sys.argv[1])
          parts = re.findall(r"^%(pre|post)\b[^\n]*\n(.*?)^%end$", text, re.S | re.M)
          assert parts, "no %pre or %post found in disk_config/iso.toml"
          for i, (kind, body) in enumerate(parts, 1):
              (out / f"{i}-{kind}.sh").write_text("#!/usr/bin/bash\n" + body)
          print(len(parts), "installer scripts")
          PY
          shellcheck -e SC2094 "${RUNNER_TEMP}"/ks/*.sh

  # THE CONSOLE ITSELF, WHICH THE IMAGE DID NOT CONTAIN UNTIL 2026-09-19.
  #
  # Both of these are CALLS to the workflows that already build these things
  # properly, not copies of their steps. That matters for the cores: the whole
  # value of build-core.yml is that it checks out an exact pinned commit,
  # asserts it, and then reads that same revision back out of the finished .so
  # — so a second way of building a core would be a second way of getting that
  # wrong, and the image would ship from the one nobody was watching.
  #
  # What it costs: about ten minutes of wall clock on every image build, in
  # parallel with nothing, because the image cannot start until the cores are
  # there. That is the honest price of the image containing what it claims to.
  # It also means every image build proves every core is at its pinned
  # revision.
  # Everything below runs unless the tested image was promoted. The
  # `!cancelled() && !failure()` is GitHub's way of saying "and do not skip
  # me just because promote was skipped", which it otherwise would.
  frontend:
    name: Frontend
    needs: [lint, promote]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' }}
    uses: ./.github/workflows/build-frontend.yml

  # NOT ON PULL REQUESTS, as of 2026-09-25. A change is proved by its
  # `testing` image, built from the same commit and judged on a console, so a
  # second full build here only repeated it. Pull requests keep the cheap
  # checks: lint and the frontend compile.
  cores:
    name: Cores
    needs: [lint, promote]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' && github.event_name != 'pull_request' }}
    # The builder container is published to GHCR by the called workflow and
    # reused whenever frontend/Containerfile has not changed. A called
    # workflow cannot have more permission than its caller gives it, so
    # without this line the core builds fail at the login step.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-core.yml

  # PLAYSTATION 2 IS NOT A CORE, which is why it is a separate workflow rather
  # than another arm of the matrix — see the header of build-pcsx2.yml.
  # It produces an artifact of the same shape, so the download below needs no
  # special case, and ci/stage-image-payload.sh REFUSES TO BUILD AN IMAGE
  # WITHOUT IT. That refusal is the point: a missing emulator does not break
  # this console, it makes catalog.cpp report PlayStation 2 as "not built on
  # this console yet" and quietly costs the library 71 games.
  playstation2:
    name: PlayStation 2
    needs: [lint, promote]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build-pcsx2.yml

  # WII U, Cemu built from source at a pin (build-cemu.yml), for the same
  # reasons and with the same refusal: ci/stage-image-payload.sh will not build
  # an image without it.
  wiiu:
    name: Wii U
    needs: [lint, promote]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build-cemu.yml

  # SEGA MODEL 2, sm2-emu built from source at a pin (build-sm2emu.yml), with
  # its catalogue, and the same refusal: ci/stage-image-payload.sh will not
  # build an image without it.
  model2:
    name: Model 2
    needs: [lint, promote]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build-sm2emu.yml

  # SEGA MODEL 3, Supermodel built from source at a pin
  # (build-supermodel.yml), with its catalogue, and the same refusal:
  # ci/stage-image-payload.sh will not build an image without it.
  model3:
    name: Model 3
    needs: [lint, promote]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build-supermodel.yml

  # REMOTE PLAY, Sunshine built at its pin with our patch (build-sunshine.yml,
  # #304), with the same refusal: ci/stage-image-payload.sh will not build an
  # image without it.
  sunshine:
    name: Sunshine
    needs: [lint, promote]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build-sunshine.yml

  # MAME 0.289, libretro's own build fetched and checked at its pins
  # (build-mame.yml), with the same refusal: ci/stage-image-payload.sh will
  # not build an image without it.
  mame:
    name: MAME
    needs: [lint, promote]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-mame.yml

  build_push:
    name: Build and push image
    needs: [lint, promote, frontend, cores, playstation2, wiiu, model2, model3, sunshine, mame]
    if: ${{ !cancelled() && !failure() && needs.promote.outputs.promoted != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Bazzite is a large base image. Without this the runner runs out of disk
      # partway through the pull.
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # The frontend and the Wii bridge, the cores, PlayStation 2, MAME 0.289,
      # Wii U, Model 2, Model 3 and Sunshine, from the jobs above. Merged into
      # one directory, which works because each artifact was staged into the
      # payload's own folders (bin/, cores/, system/, mame/, cemu/, sm2emu/,
      # supermodel/, sunshine/) and no two of them hold a file of the same
      # name: bin/ comes from the frontend, cores/ has one .so per core plus
      # the PS2 emulator and its libraries, system/ has PPSSPP's, Dolphin's
      # and PCSX2's files under different directories, mame/, cemu/, sm2emu/,
      # supermodel/ and sunshine/ one emulator each.
      - name: Fetch the frontend and the cores
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          # Dotted and gitignored, because `just build` and
          # `just generate-build-tags` both decide whether to stamp the image
          # with a revision by asking whether `git status -s` is empty — so an
          # untracked download directory costs the image its labels and its
          # git-sha tags, silently.
          path: .artifacts
          pattern: '*-linux-x86_64'
          merge-multiple: true

      # Fails in seconds if anything is missing, rather than thirteen minutes
      # into the image build — and names which core it was. The script checks
      # the list against cores/build-core.sh rather than against a copy of it.
      - name: Collect them into the image payload
        run: ci/stage-image-payload.sh .artifacts

      # THE FILES THE IMAGE BUILD WOULD DOWNLOAD FROM OUTSIDE (RPCS3, Xenia
      # Edge, xemu's drive), kept in the Actions cache so a release site that
      # answers 500 cannot fail a build (RPCS3's, 2026-10-12). The key is the
      # install scripts' own pins; the scripts check each sha256 again.
      # ci/fetch-pinned.sh. The key is read on its own line: inside echo's
      # arguments a pin that does not parse would fail unseen.
      - name: Pinned downloads, the cache key
        id: pins
        run: |
          key=$(ci/fetch-pinned.sh key)
          echo "key=pinned-downloads-${key}" >> "${GITHUB_OUTPUT}"

      - name: Pinned downloads, from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .downloads
          key: ${{ steps.pins.outputs.key }}
          restore-keys: pinned-downloads-

      - name: Pinned downloads, into the payload
        run: ci/fetch-pinned.sh fetch .downloads image_payload/downloads

      # THE VECTREX GAMES' SCREEN SHEETS (#224): libretro/overlay-borders'
      # Game Overlay folder at a pinned commit, each file checked by its
      # sha256 (tools/fetch-vectrex-overlays.py, which holds both), kept in
      # the Actions cache the same way. Not in the repository; the console
      # never fetches them. build_files/install-frontend.sh installs them.
      - name: Vectrex sheets, from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .vectrex-sheets
          key: vectrex-sheets-${{ hashFiles('tools/fetch-vectrex-overlays.py') }}
          restore-keys: vectrex-sheets-

      - name: Vectrex sheets, into the payload
        run: |
          python3 tools/fetch-vectrex-overlays.py .vectrex-sheets
          mkdir -p image_payload/vectrex
          cp .vectrex-sheets/*.png image_payload/vectrex/

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Check Justfile
        run: just check

      - name: Prepare environment
        run: |
          set -euo pipefail
          IMAGE_NAME=$(just image_name)
          DEFAULT_TAG=$(just generate-default-tag)
          # The testing branch publishes to its own tag. Everything else that
          # publishes is main, and goes to `latest`.
          if [[ "${GITHUB_REF}" == refs/heads/testing ]]; then
            DEFAULT_TAG=testing
          fi
          # The version, 2026.09.28, numbered by the tags already published.
          # A build that publishes must be able to read them.
          CABINETOS_VERSION=$(ci/next-version.sh "${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}")
          echo "Version: ${CABINETOS_VERSION}, tag: ${DEFAULT_TAG}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "CABINETOS_VERSION=${CABINETOS_VERSION}" >> "${GITHUB_ENV}"

      - name: Build image
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # NO RECHUNK, as of 2026-09-23. It was here from the first commit, copied
      # from the ublue template with a comment saying it made updates download
      # only what changed. It did the opposite for this image: it regroups the
      # filesystem by RPM package, nothing CabinetOS adds belongs to a package,
      # so a 1.4 MB frontend change shipped 546 MB. It also took 9 of the 16
      # minutes. The Containerfile's own layer order now does that job, and a
      # frontend change ships 0.7 MB, measured by bootc on the test VM.
      # docs/PROJECT.md open question 27 has the runs and the numbers.
      #
      # What each layer holds, and a failure if any of the build context
      # (the scripts, the payload) got into one. pipefail, because tee's exit
      # status would otherwise hide the script's.
      - name: What each layer holds
        run: |
          set -euo pipefail
          ci/layer-report.sh "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" | tee /tmp/layers.txt

      - name: Generate tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      # Everything below only runs on main and testing. Pull requests stop
      # here, having proved the image builds, and so does a manual run on any
      # other branch: until 2026-10-12 one would have published that branch
      # as `latest`, since every branch but testing takes that tag.
      #
      # A CHANNEL TAG ONLY EVER NAMES A SIGNED IMAGE (#398, SCRIPTS-02).
      # Every console made by the installer refuses an unsigned update (#135,
      # build_files/require-signed-updates.sh). So the image goes up under
      # every tag but the channel's, that digest is signed, the signature is
      # checked the way a console checks it, and only then do `testing` or
      # `latest` move to it. A run that stops before the last step (a
      # Sigstore outage, a cosign error, a cancel) leaves the channel where
      # it was. Its version tag stays up, perhaps unsigned, and nothing
      # follows it; the next run takes the next number.
      - name: Check for a signing key
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [[ -z "${SIGNING_SECRET}" ]]; then
            echo "::error::No SIGNING_SECRET: consoles refuse an unsigned image (#135), so nothing is published. CONTRIBUTING.md, \"Generate a signing key\"."
            exit 1
          fi

      - name: Install cosign
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Login to GHCR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read before the channel moves, so the report below says what a
      # console on the previous image downloads to take this one.
      - name: Remember the previous image
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          skopeo inspect --raw "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            > /tmp/previous.json || rm -f /tmp/previous.json

      - name: Push to GHCR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          # TWO BUILDS THE SAME DAY CAN PICK THE SAME NUMBER if they overlap
          # (a testing push and a merge to main, say), because the number is
          # read at the start and published at the end. The version is baked
          # into the image, so it cannot be renumbered here: refuse, and let a
          # re-run take the next one, rather than let two images share a name.
          if skopeo inspect --raw "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${CABINETOS_VERSION}" >/dev/null 2>&1; then
            echo "::error::${CABINETOS_VERSION} was published by another build while this one ran. Re-run this workflow for the next number."
            exit 1
          fi
          rm -f /tmp/digestfile
          for tag in ${ALIAS_TAGS}; do
            # The channel's tag moves in the last step, once this is signed.
            if [[ "${tag}" == "${DEFAULT_TAG}" ]]; then continue; fi
            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          digest=$(< /tmp/digestfile)
          if [[ "${digest}" != sha256:* ]]; then
            echo "::error::The push gave no digest to sign (tags: ${ALIAS_TAGS})"
            exit 1
          fi
          echo "Pushed ${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign image
        id: sign
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # The old bundle format is required for rpm-ostree/bootc policy
          # verification to accept the signature.
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # THE CONSOLES' OWN CHECK, before any console can see the image
      # (#398, SCRIPTS-48): a signature on this digest, in the old format
      # they read (the `sha256-<hex>.sig` tag, which --new-bundle-format=false
      # makes cosign read and nothing else), made by the key whose public
      # half the image ships. A SIGNING_SECRET that does not match
      # system_files/etc/pki/containers/cabinetos.pub fails here, with the
      # channel unmoved. The transparency log is not checked because the
      # consoles' policy does not check it (require-signed-updates.sh gives
      # it no rekorPublicKeyPath). cosign marks --new-bundle-format
      # deprecated; the version that drops it fails this step, loudly,
      # before the channel moves.
      - name: Check the signature as a console does
        id: verify
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign verify \
            --new-bundle-format=false \
            --insecure-ignore-tlog=true \
            --key system_files/etc/pki/containers/cabinetos.pub \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Copied by digest inside the registry, not pushed again, so the
      # channel names exactly the bytes that were signed and checked. Read
      # back, not assumed, as ci/promote-tested.sh does for `latest`.
      - name: Point the channel at the signed image
        id: channel
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          skopeo copy --preserve-digests \
            --dest-creds "${REGISTRY_USER}:${REGISTRY_TOKEN}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          now=$(skopeo inspect "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" | jq -r '.Digest')
          if [[ "${now}" != "${DIGEST}" ]]; then
            echo "::error::${DEFAULT_TAG} is ${now}, not the signed ${DIGEST}"
            exit 1
          fi
          echo "${DEFAULT_TAG} is ${DIGEST}, signed and checked"

      - name: Summary
        if: always()
        env:
          PUBLISHES: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing' }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
          SIGNED: ${{ steps.sign.outcome }}
          CHECKED: ${{ steps.verify.outcome }}
          MOVED: ${{ steps.channel.outcome }}
        run: |
          {
            echo "## CabinetOS image"
            echo
            echo "- Image: \`${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}\`"
            echo "- Version: \`${CABINETOS_VERSION}\`"
            if [[ "${PUBLISHES}" != "true" ]]; then
              echo "- Published: no, only main and testing publish"
            elif [[ "${MOVED}" == "success" ]]; then
              echo "- Published: \`${DEFAULT_TAG}\` is \`${DIGEST}\`, signed and checked against cabinetos.pub"
            else
              echo "- Published: **no, \`${DEFAULT_TAG}\` still names the previous image** (pushed: ${DIGEST:-nothing}; signed: ${SIGNED:-not run}; checked: ${CHECKED:-not run}; moved: ${MOVED:-not run})"
            fi
            echo
            echo "### What a console on the previous image downloads"
            echo '```'
            if [[ -f /tmp/previous.json && -n "${DIGEST}" ]]; then
              ci/compare-images.sh /tmp/previous.json \
                "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" || true
            elif [[ -n "${DIGEST}" ]]; then
              echo "no previous image to compare against"
            else
              echo "nothing was pushed"
            fi
            echo '```'
            echo
            echo "### Our layers"
            echo '```'
            cat /tmp/layers.txt 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
