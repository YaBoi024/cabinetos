---
# Watch the Bazzite base image and open a pull request when it moves.
#
# Bazzite rebuilds daily. A plain dependency bot would therefore open a pull
# request every day saying "digest changed", which is not information — it is
# noise that trains you to merge without reading.
#
# So this workflow does the work a bot cannot: it diffs the new base's package
# manifest against the one committed at the last bump, classifies the result
# against ci/base-watch.txt, and names the pull request RELEVANT or ROUTINE in
# its title.
# The pull request also lists its own checks, for the areas that changed
# only, and carries update notes people can read (2026-10-09). The reasoning
# lives in ci/check-base-update.sh and ci/base-report.py.
#
# It never merges anything. Per docs/PROJECT.md constraint 2, the base moves
# deliberately, and an image that builds is not the same as an image that boots.

name: Check Bazzite base update

on:
  schedule:
    # Monthly, the 1st at 09:00 UTC (MMagTech, 2026-10-18; docs/PROJECT.md,
    # "Staying current with Bazzite"). Bazzite builds daily, but every base
    # move costs players about 3 GB and one round of TV checks, and a month
    # of changes downloads about the same as a week of them. A player's fault
    # that a newer Bazzite fixes, or a security hole, is taken by hand in
    # between (workflow_dispatch).
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "Bazzite channel to track"
        required: false
        default: "stable"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: base-update
  cancel-in-progress: false

jobs:
  check:
    name: Check for a base update
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The digest check is cheap. The package diff is not — it pulls a ten
      # gigabyte image — so make room before finding out whether it is needed.
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Check the base image
        id: check
        env:
          BASE_REPO: ghcr.io/ublue-os/bazzite-deck
          BASE_CHANNEL: ${{ inputs.channel || 'stable' }}
          # Read-only, for the OGC kernel's tags on GitHub (the kernel's
          # own patches go in the pull request).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/check-base-update.sh

      - name: Open a pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BASE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          RELEVANT: ${{ steps.check.outputs.relevant }}
        run: |
          set -euo pipefail

          BRANCH="base-update/${NEW_VERSION}"

          # This bump already pushed: nothing to do if it has a pull request
          # (open, or one a person closed or merged). With none, a run before
          # this one failed to open it (below): open it now.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            prs=$(gh pr list --head "${BRANCH}" --state all --json number \
              --jq 'map("#\(.number)") | join(" ")')
            if [[ -n "${prs}" ]]; then
              echo "Branch ${BRANCH} already has a pull request (${prs}); leaving it alone."
              exit 0
            fi
            echo "Branch ${BRANCH} is pushed but has no pull request; opening it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git checkout -b "${BRANCH}"
            git add Containerfile base-manifest.txt
            # The update notes are the commit's body, so `git log` reads as
            # the update's notes too.
            { echo "Bump Bazzite base to ${NEW_VERSION}"; echo; echo "${SUMMARY}"; echo
              cat /tmp/base-notes.md; } > /tmp/commit-msg.txt
            git commit -F /tmp/commit-msg.txt
            git push origin "${BRANCH}"
          fi

          LABEL="routine"
          if [[ "${RELEVANT}" == "true" ]]; then LABEL="relevant"; fi

          # THIS NEEDS A REPOSITORY SETTING, and without it the whole
          # workflow is worse than useless.
          #
          # Settings -> Actions -> General -> "Allow GitHub Actions to create
          # and approve pull requests". It is OFF by default, and with it off
          # `gh pr create` fails with:
          #
          #   GitHub Actions is not permitted to create or approve pull
          #   requests (createPullRequest)
          #
          # The branch has already been pushed by then, so the failure leaves a
          # branch with nobody watching it. That is exactly what happened on
          # 2026-09-14: the base moved, the branch appeared, the run went red,
          # and the bump was found three days later by someone tidying up
          # branches. A half-finished automation is harder to notice than one
          # that never ran.
          if ! gh pr create \
              --title "Bazzite base → ${NEW_VERSION} (${LABEL})" \
              --body-file /tmp/pr-body.md \
              --base "${{ github.event.repository.default_branch }}" \
              --head "${BRANCH}"; then
            {
              echo "### Could not open the pull request"
              echo
              echo "The branch \`${BRANCH}\` is pushed and the bump is in it."
              echo "If the error mentions \`createPullRequest\`, turn on"
              echo "**Settings → Actions → General → Allow GitHub Actions to"
              echo "create and approve pull requests**, then re-run this job."
              echo
              echo "Open it by hand meanwhile:"
              echo '```'
              echo "gh pr create --base main --head ${BRANCH}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          GAMESCOPE: ${{ steps.check.outputs.gamescope }}
        run: |
          {
            echo "## Base update check"
            echo
            if [[ "${{ steps.check.outputs.changed }}" == "true" ]]; then
              echo "Base moved to \`${{ steps.check.outputs.new_version }}\`."
              echo
              echo "**${{ steps.check.outputs.summary }}**"
              echo
              # The two ways the gamescope check can fail to tell (#487) need
              # different fixes, so each says its own.
              case "${GAMESCOPE}" in
                ok) echo "gamescope takes every flag we pass it." ;;
                missing) echo "gamescope no longer takes a flag we pass it (named in the pull request)." ;;
                no-help) echo "gamescope's flags not checked: \`gamescope --help\` did not run in the new base." ;;
                too-few) echo "gamescope's flags not checked: too few were read from a script (the reader broke; the step's log says which)." ;;
                *) echo "gamescope's flags not checked: \`ci/check-gamescope-flags.sh\` stopped (the step's log says why)." ;;
              esac
            else
              echo "No change — still on the pinned digest."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
