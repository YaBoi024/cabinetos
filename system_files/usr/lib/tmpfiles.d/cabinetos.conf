# The directory the console keeps everything in.
#
# Games, firmware, and every person's saves, states and keeps live under
# /var/lib/cabinetos. The frontend creates the shape inside it (storage.h), but
# it cannot create the directory itself: the session runs as the unprivileged
# `cabinet` user and /var/lib is root's.
#
# WITHOUT THIS THE CONSOLE WRITES TO THE WRONG PLACE AND SAYS SO ONLY ON
# STDERR. storage::root() tries /var/lib/cabinetos, finds it cannot be created,
# and falls back to the working directory — which for a systemd service is `/`.
# That is the failure this line exists to prevent, and it is silent.
#
# tmpfiles.d AND NOT A `mkdir` IN THE CONTAINERFILE. bootc treats /var in an
# image like a Docker VOLUME: its contents are unpacked from the INITIAL image
# only, and no later image changes it. A directory created at build time would
# appear on a machine installed today and never on one that upgraded into it —
# green build, and a console that writes to / on exactly the machines that have
# been around longest. See docs/PROJECT.md, open question 21, which is the same
# trap one layer along.
#
# Run every boot by systemd-tmpfiles-setup.service, which orders before
# multi-user.target and therefore before cabinetos-session.service.
d /var/lib/cabinetos 0755 cabinet cabinet -

# The session user's home (the account is sysusers.d/cabinetos.conf, which
# makes no home). On a new console it is made the way useradd --create-home
# made it in the installer until 2026-11-03: a copy of /etc/skel, every file
# in it the account's, the folder itself 0700. A home that is there already
# and not empty is not copied into; only the folder's own owner and mode are
# set, which every console so far already has (cabinet:cabinet, 0700).
# Before the session, which starts in it: systemd-tmpfiles-setup.service runs
# after systemd-sysusers.service, so the account exists by then.
C /var/home/cabinet 0700 cabinet cabinet - /etc/skel

# System update's status, written by root (/usr/libexec/cabinetos-update) and
# read by the session. /run because none of it should outlive a boot.
d /run/cabinetos-update 0755 root root -

# Steam's slice of the main drive (/usr/libexec/cabinetos-steam; issue #223).
# Root's, outside the console's storage root, so the cache's "eviction only
# deletes inside cache/" stays obviously true and File access never shows it.
# No copy-on-write (+C), so the slice file made in it is allocated once, in
# place, and never copied on write by the drive's btrfs.
d /var/lib/cabinetos-steam 0755 root root -
h /var/lib/cabinetos-steam - - - - +C
