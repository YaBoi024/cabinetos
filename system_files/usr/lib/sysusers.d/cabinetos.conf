# The account the CabinetOS session runs as.
#
# Made by the image, not by the installer, so that every way onto a drive (the
# installer ISO, a disk image) gives the same account
# (docs/decisions/2026-11-03-first-time-setup-in-the-os.md). Until 2026-11-03
# the installer made it in a %post; these lines make exactly that account:
# uid and gid 1000, in `wheel`, home /var/home/cabinet, with no password. File
# access sets one when it is turned on, and the session logs in by itself. A
# `u` line's account is created with the password locked ("!*") and no expiry,
# so a key still opens Developer access; `u!` would expire it and lock that out.
#
# THE NUMBER MATTERS: cabinetos-remoteplay.service names /run/user/1000.
#
# systemd-sysusers runs at the first start of every deployment (ostree drops
# /etc/.updated in each new one, so ConditionNeedsUpdate=/etc holds), and makes
# only what is missing: a console that already has the account, from the
# installer's Users screen or its %post, or a development VM from
# disk_config/disk.toml, keeps it exactly as it is. Its home folder is made by
# tmpfiles.d (cabinetos.conf there); sysusers makes none.
g cabinet 1000
u cabinet 1000:1000 "CabinetOS" /var/home/cabinet /bin/bash
m cabinet wheel
