# NOTHING IS ASKED ON A TEXT CONSOLE. systemd's first-boot wizard runs at a
# new system's first start (an empty /etc/machine-id) and asks, on the
# screen's text console, for every setting /etc lacks: the language, the
# keyboard and the time zone, none of which the image has. A portable install
# (a disk image on a USB drive, which no installer ran on) would stop there
# with a prompt on the television before the console ever starts. The one
# question a console needs, the time zone, is first run's first screen
# (frontend/src/setup.cpp). An install from the ISO has all three from the
# installer, so the wizard asked it nothing and still does not.
#
# Still run, with no prompts: settings handed to it as credentials apply.
[Service]
ExecStart=
ExecStart=systemd-firstboot
