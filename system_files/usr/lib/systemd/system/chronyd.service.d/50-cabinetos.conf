# NO CLOCK SYNC ON A START THAT BEGAN WITHOUT A TIME ZONE: a portable
# install's first start, before first run's Time zone screen.
#
# THE PC'S CLOCK IS ITS OWNER'S. A console with no installer (a disk image
# written to a USB drive) keeps the PC's hardware clock in local time, the
# way Windows does (/etc/adjtime, LOCAL), so the time Windows shows is never
# changed by running CabinetOS. Chrony keeps the hardware clock set
# (`rtcsync`: the kernel writes it every eleven minutes), and the kernel
# writes it in local time only when the start began with a time zone that is
# not UTC: it takes that from the first time zone it is told, once per start.
# A start with no zone would write UTC into a clock Windows reads as local
# time, hours off. So such a start keeps the clock it read from the PC, which
# is read again in the zone once it is chosen (/usr/libexec/cabinetos-timezone),
# and chrony starts from the next start on.
#
# Every console with a zone (every install from the ISO: the installer's Time
# & Date screen sets one) starts chrony as before.
[Unit]
ConditionPathExists=/etc/localtime
