# Wi-Fi power saving off on every console (#666; the decision is
# docs/decisions/2026-11-08-wifi-scans-and-power-saving.md). With it on, the
# reference console's card let a LinkUp friend's sound arrive up to 64 ms
# late, past the friend's 40 ms queue; off, 31 ms at most. A console is on
# mains power. It applies at each connect, to every saved network that does
# not name its own, and the console's never do.
# build_files/wifi-scan-rule.sh stops the build if NetworkManager does not
# read it.
[connection]
wifi.powersave=2
