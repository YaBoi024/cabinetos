# WHERE THE SOUND GOES (#341, "No audio"; MMagTech's rule, 2026-10-13): the TV
# the picture is on first; a headphone jack that senses the plug takes over
# while headphones are in and hands back when they come out; nothing else
# takes the sound from the TV. No setting.
#
# Most of it is WirePlumber's own behaviour, documented in "Node priorities"
# (pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/
# priorities.html). Two settings here and two steps at build time make it hold
# on a console:
#
# 1. USB SOUND RANKS BELOW THE TV. WirePlumber ranks an analog output above
#    HDMI, and a USB sound chip is an analog output. A reported machine
#    (HCAR5000-MI) has its jack on a built-in C-Media USB chip that cannot
#    sense a plug, so the console played into an empty jack. HDMI sits around
#    600 to 700 here (696 on the A9's TV); 100 is below any of it, so a USB
#    jack stays below the TV even when it can sense a plug.
#
# 2. NO CHOICE IS REMEMBERED. A chosen output beats every priority, and the
#    choice is kept across restarts. Remote Play makes one at the end of every
#    stream (Sunshine sets the TV back as the default by name), so after one
#    stream headphones never took over again (A9, 2026-10-13). With this off,
#    a restart always starts from the rule above. A choice made during a run
#    still holds for that run, which is what Remote Play needs to carry the
#    sound while a device streams.
#
# 3. A BUILT-IN SPEAKER COUNTS AS NOT THERE (#547), in
#    build_files/built-in-speaker.sh. A speaker inside the case cannot sense
#    anything and shares one output with the headphone jack, so no priority
#    can put it below the TV and the headphones above it. With its jack state
#    set to "no", the onboard analog output exists only while headphones are
#    in, as on a machine with no speaker.
#
# 4. A BACKUP OUTPUT WHILE THE TV'S IS GONE (#228), in
#    build_files/sound-backup-output.sh. pipewire-pulse starts at login, so
#    PipeWire's Dummy Output is there whenever no other output is. The
#    console's sound moves to it when the screen sleeps or the TV goes off,
#    and back when the TV returns; without it, SDL could be left on the TV's
#    dead output and the console stayed silent until it was restarted.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]

wireplumber.settings = {
  node.restore-default-targets = false
}
