# WHERE THE SOUND GOES (#655; MMagTech's rule from #341 and #547): the screen
# the picture is on plays the sound; an output takes over only if it reports
# something actually plugged in; nothing else takes the sound. When the
# screen's sound is gone the result is silence. No setting.
#
# The rule itself is scripts/cabinetos-sound-output.lua. Three things beside it
# make it hold on a console:
#
# 1. USB SOUND RANKS BELOW THE TV. WirePlumber ranks an analog output above
#    HDMI, and a USB sound chip is an analog output. The rule leaves out a USB
#    jack that cannot sense a plug (#341, HCAR5000-MI); this keeps one that can
#    below the TV as well. HDMI sits around 600 to 700 here (696 on the A9's
#    TV); 100 is below any of it.
#
# 2. NO CHOICE IS REMEMBERED. A chosen output beats every priority, and the
#    choice is kept across restarts. Remote Play made one at the end of every
#    stream (Sunshine set the TV back as the default by name), so after one
#    stream headphones never took over again (A9, 2026-10-13). With this off,
#    a restart always starts from the rule. A choice made during a run still
#    holds for that run, which is what Remote Play needs to carry the sound
#    while a device streams.
#
# 3. A BACKUP OUTPUT WHILE THE TV'S IS GONE (#228), in
#    build_files/sound-backup-output.sh. pipewire-pulse starts at login, so
#    PipeWire's Dummy Output is there whenever no other output is. The
#    console's sound moves to it when the screen sleeps or the TV goes off,
#    and back when the TV returns; without it, SDL could be left on the TV's
#    dead output and the console stayed silent until it was restarted.
#
# The script loads through a required virtual part that only wants it, so a
# broken script leaves WirePlumber working. Listed as optional in the profile
# it was never loaded at all, and required, a broken script would stop
# WirePlumber and with it all sound. It loads before the event source starts,
# as WirePlumber's own hooks do (its wireplumber.components.rules): loaded
# after, it missed the choice made at start-up.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]

wireplumber.settings = {
  node.restore-default-targets = false
}

wireplumber.components = [
  {
    name = cabinetos-sound-output.lua, type = script/lua
    provides = custom.cabinetos-sound-output
    before = [ support.standard-event-source ]
  }
  {
    type = virtual, provides = custom.cabinetos
    wants = [ custom.cabinetos-sound-output ]
  }
]

wireplumber.profiles = {
  main = {
    custom.cabinetos = required
  }
}
